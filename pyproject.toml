[project]
name = "evidone_pose_detection"
version = "0.1.11-beta0"
description = "Real-Time Pose Detection with Face Anonymization"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Roger Casimiro", email = "rogercasimiromartinez@gmail.com" },
]


dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.12.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.197",
]

[project.urls]

[dependency-groups]
dev = [
    "mypy>=2.4",

    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-env>=1.8",
    "ruff>=0.17",
    "ebump>=0.2.2",
]

docs = ["zensical>=0.0.72", "mkdocstrings[python]>=1.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]
override-dependencies = ["opencv-python; sys_platform == 'nonexistent'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
evidone = "evidone_pose_detection.main:main"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".cookie-pyrate"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: Check variables shadowing
    "ARG",    # flake8-unusedarguments
    "B",      # flake8-bugbear: Finds likely bugs and design problems
    "C901",   # Mccabe complexity checker
    "ERA",    # Erradicate
    "E4",     # Pycodestyle: Line length, indentation, etc.
    "E7",     # Pycodestyle: Miscellaneous checks
    "E9",     # Pycodestyle: Syntax errors
    "F",      # Pyflakes: Unused imports, undefined variables, etc.
    "FIX",    # Avoid lines containing TODO tags
    "G",      # flake8-logging-format: Ensure logging messages follow best practices.
    "I",      # Isort: Import sorting
    "LOG",    # flake8-logging: Use the logging module correctly
    "N",      # pep8-naming: Enforce naming conventions
    "PGH004", # Enforce specify the rule to avoid on noqa tags
    "PL",     # Pylint
    "PTH",    # flake8-use-pathlib: Enforces pathlib usage
    "RUF",    # Ruff-specific rules: Mostly for handling noqa tags and general stuff
    "S",      # flake8-bandit: Identifies common security issues in code
    "SIM",    # flake8-simplify
    "T20",    # flake8-print: Avoids print in the code
    "UP",     # Pyupgrade
    "W",      # Pycodestyle warnings
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101", "PLR2004", "PLR0913", "S603"]  # S603: boundary probes run a subprocess
"scripts/**" = ["T20", "S603"]  # Allow print statements and subprocess calls on the scripts

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["keyPressEvent", "closeEvent", "isOpened"]  # Qt and OpenCV APIs

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
extra_checks = true


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=80"
python_files = "tests.py test_*.py *_test.py"
pythonpath = ["./src", "./tests"]
env_files = [".env.test"]


[tool.ebump.patterns]
"src/evidone_pose_detection/__init__.py" = ['^__version__ = "{version}"$']
